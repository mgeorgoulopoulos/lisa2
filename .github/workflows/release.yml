name: Build, test and release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/build/pyinstaller-cache
      LISA2_DATA_DIR: ${{ github.workspace }}/build/runtime
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build.txt
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth libegl1 libgl1 libxkbcommon0
      - name: Python dependencies
        run: python -m pip install -r requirements-lock.txt -r requirements-build.txt
      - name: Check Windows clone launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: Lisa2.bat --prepare-only
      - name: Check Linux clone launcher
        if: runner.os == 'Linux'
        run: bash Lisa2.sh --prepare-only
      - name: Renderer and project regression checks
        run: |
          python -m tests.check_obj_cameras
          python -m tests.check_dimensions
      - name: Native Windows file-drop regression
        if: runner.os == 'Windows'
        run: python -m tests.check_native_drop
      - name: Build standalone application and portable archive
        run: python packaging/build.py
      - name: Test Windows executable without installed Python
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Lisa2/Lisa2.exe -ArgumentList '--smoke-test','--report',"$env:GITHUB_WORKSPACE/build/windows-check.json" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Standalone test failed: $($process.ExitCode)" }
          if ((Get-Content build/windows-check.json | ConvertFrom-Json).status -ne 'passed') { throw 'Missing successful smoke report' }
      - name: Test Linux portable archive after extraction
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/extracted
          tar -xzf release/Lisa2-Linux-x86_64.tar.gz -C build/extracted
          xvfb-run -a build/extracted/Lisa2/start.sh --smoke-test --report "$GITHUB_WORKSPACE/build/linux-check.json"
          python -c "import json; assert json.load(open('build/linux-check.json'))['status']=='passed'"
      - name: Install Inno Setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/install-inno.ps1
      - name: Compile Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ISCC.exe "/DSourceRevision=$($env:GITHUB_SHA.Substring(0,7))" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Test installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = "$env:GITHUB_WORKSPACE/build/installed app"
          $process = Start-Process -FilePath release/Lisa2-Windows-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installDir`"" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $process = Start-Process -FilePath "$installDir/Lisa2.exe" -ArgumentList '--smoke-test','--report',"$env:GITHUB_WORKSPACE/build/installed-check.json" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Installed application failed' }
          if ((Get-Content build/installed-check.json | ConvertFrom-Json).status -ne 'passed') { throw 'Installed application report failed' }
      - name: Keep diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ runner.os }}
          path: |
            build/*check.json
            build/runtime/launcher-error.log
            build/Lisa2/warn-Lisa2.txt
          if-no-files-found: ignore
      - name: Keep release packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  linux-compat:
    name: Linux portable compatibility (Ubuntu 24.04)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LISA2_DATA_DIR: ${{ github.workspace }}/runtime
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages-Linux
          path: release
      - name: Desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libegl1 libgl1 libxkbcommon0
      - name: Run the extracted bundle without installing Python dependencies
        run: |
          tar -xzf release/Lisa2-Linux-x86_64.tar.gz
          xvfb-run -a ./Lisa2/start.sh --smoke-test --report "$GITHUB_WORKSPACE/check.json"
          python3 -c "import json; assert json.load(open('check.json'))['status']=='passed'"
      - name: Keep compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-Linux-compat
          path: |
            check.json
            runtime/launcher-error.log
          if-no-files-found: ignore

  publish:
    needs: [build, linux-compat]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test -s Lisa2-Windows-Setup.exe
          test -s Lisa2-Windows-Portable.zip
          test -s Lisa2-Linux-x86_64.tar.gz
          sha256sum Lisa2-* > SHA256SUMS.txt
          tag="build-${SOURCE_SHA}"
          printf '%s\n' 'Standalone builds of Lisa2. Python is included.' '' 'Windows: download and run Lisa2-Windows-Setup.exe, or extract the portable ZIP.' 'Linux x86-64: extract the tar.gz and run ./Lisa2/start.sh (Ubuntu 22.04+ baseline).' '' 'Windows builds are unsigned. Checksums are provided in SHA256SUMS.txt.' > release-notes.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This commit already has a release; leaving its tested assets unchanged.'
          else
            gh release create "$tag" Lisa2-Windows-Setup.exe Lisa2-Windows-Portable.zip Lisa2-Linux-x86_64.tar.gz SHA256SUMS.txt --target "$SOURCE_SHA" --title "Lisa2 (${SOURCE_SHA:0:7})" --notes-file release-notes.txt --latest
          fi
